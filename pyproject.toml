[project]
name = "langchain-course-ro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "orazvan", email = "orazvan@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "langchain>=1.5.0",
    "langchain-google>=0.1.1",
    "langchain-google-genai>=4.5.0",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.7.4",
    "langsmith>=0.14.17",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-course-ro = "langchain_course_ro:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
